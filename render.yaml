services:
  - type: web
    name: jobfinder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:5000 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jobfinder-db
          property: connectionString
      - key: BABEL_DEFAULT_LOCALE
        value: es
      - key: APP_NAME
        value: JobConnect
    # Optional: auto-deploy from main branch
    autoDeploy: true
  - type: postgres
    name: jobfinder-db
    plan: free