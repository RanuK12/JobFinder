<!DOCTYPE html>
<html lang="{{ current_language | default('es') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ _('JobConnect - Conectamos talento con oportunidades laborales') }}">
    <title>{{ title | default('JobConnect') }} | {{ app_name | default('JobConnect') }}</title>

    <!-- Alpine.js for interactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        [x-cloak] { display: none !important; }

        :root {
            --primary-color: #6A5ACD;
            --primary-dark: #4B0082;
            --accent-color: #FF6B6B;
            --background-color: #f9fafb;
            --text-color: #2d3748;
        }

        .text-primary { color: var(--primary-color); }
        .bg-primary { background-color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }

        .primary-bg {
            background-color: var(--primary-color);
            color: white;
            transition: background-color 0.3s ease;
        }
        .primary-bg:hover { background-color: var(--primary-dark); }

        .accent-bg {
            background-color: var(--accent-color) !important;
            color: white !important;
        }
        .accent-bg:hover { background-color: #e64a4a !important; }

        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(106, 90, 205, 0.1);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(106, 90, 205, 0.12);
        }

        .bg-purple-50 { background-color: rgba(106, 90, 205, 0.08); }

        /* Form styles */
        .form-input {
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(106, 90, 205, 0.1);
            outline: none;
        }

        /* Button primary style */
        .button-primary {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .button-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* Smooth page transitions */
        body {
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
    </style>
</head>
<body class="min-h-screen bg-gray-50 pt-16">
    {% include 'navbar.html' %}

    <main class="container mx-auto py-8 px-4 max-w-6xl" role="main">
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-6 space-y-3" role="alert">
                    {% for category, message in messages %}
                        <div class="p-4 rounded-lg flex items-center gap-3 
                            {% if category == 'success' %}bg-green-50 border border-green-200 text-green-800
                            {% elif category == 'error' or category == 'danger' %}bg-red-50 border border-red-200 text-red-800
                            {% elif category == 'warning' %}bg-yellow-50 border border-yellow-200 text-yellow-800
                            {% else %}bg-blue-50 border border-blue-200 text-blue-800{% endif %}"
                            x-data="{ show: true }" x-show="show" x-transition>
                            <i class="fas 
                                {% if category == 'success' %}fa-check-circle
                                {% elif category == 'error' or category == 'danger' %}fa-exclamation-circle
                                {% elif category == 'warning' %}fa-exclamation-triangle
                                {% else %}fa-info-circle{% endif %}"></i>
                            <span class="flex-1">{{ message }}</span>
                            <button @click="show = false" class="text-gray-400 hover:text-gray-600" aria-label="Cerrar">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-12 py-8">
        <div class="container mx-auto px-4 max-w-6xl">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-briefcase text-primary"></i>
                    <span class="font-bold text-primary">JobConnect</span>
                    <span class="text-gray-500 text-sm">&copy; {{ now.year }}</span>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-500">
                    <a href="{{ url_for('set_lang', lang='es') }}" 
                       class="hover:text-primary transition {% if current_language == 'es' %}font-bold text-primary{% endif %}">ES</a>
                    <a href="{{ url_for('set_lang', lang='en') }}" 
                       class="hover:text-primary transition {% if current_language == 'en' %}font-bold text-primary{% endif %}">EN</a>
                    <a href="{{ url_for('set_lang', lang='it') }}" 
                       class="hover:text-primary transition {% if current_language == 'it' %}font-bold text-primary{% endif %}">IT</a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
