{% extends 'base.html' %}
{% set title = _('Editar Oferta Laboral') %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-8">
    <h1 class="text-3xl font-bold text-primary mb-6 text-center">
        <i class="fas fa-edit mr-2"></i>{{ _('Editar Oferta Laboral') }}
    </h1>

    <form method="POST" class="space-y-6">
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700">
                {{ _('Título del Puesto') }} *
            </label>
            <input type="text" id="title" name="title" required
                   value="{{ job.title }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">
        </div>

        <div>
            <label for="company" class="block text-sm font-medium text-gray-700">
                {{ _('Empresa') }} *
            </label>
            <input type="text" id="company" name="company" required
                   value="{{ job.company }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="location" class="block text-sm font-medium text-gray-700">
                    {{ _('Ubicación') }}
                </label>
                <input type="text" id="location" name="location"
                       value="{{ job.location }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">
            </div>
            <div>
                <label for="job_type" class="block text-sm font-medium text-gray-700">
                    {{ _('Tipo de Contrato') }}
                </label>
                <select id="job_type" name="job_type"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">
                    <option value="full-time" {{ 'selected' if job.job_type == 'full-time' }}>{{ _('Tiempo Completo') }}</option>
                    <option value="part-time" {{ 'selected' if job.job_type == 'part-time' }}>{{ _('Medio Tiempo') }}</option>
                    <option value="contract" {{ 'selected' if job.job_type == 'contract' }}>{{ _('Freelance/Contrato') }}</option>
                </select>
            </div>
        </div>

        <div>
            <label for="salary_range" class="block text-sm font-medium text-gray-700">
                {{ _('Rango Salarial') }}
            </label>
            <input type="text" id="salary_range" name="salary_range"
                   value="{{ job.salary_range }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">
        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700">
                {{ _('Descripción del Puesto') }} *
            </label>
            <textarea id="description" name="description" rows="5" required
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">{{ job.description }}</textarea>
        </div>

        <div>
            <label for="requirements" class="block text-sm font-medium text-gray-700">
                {{ _('Requisitos') }}
            </label>
            <textarea id="requirements" name="requirements" rows="4"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">{{ job.requirements }}</textarea>
        </div>

        <div>
            <label for="url" class="block text-sm font-medium text-gray-700">
                {{ _('URL de la Oferta (opcional)') }}
            </label>
            <input type="url" id="url" name="url"
                   value="{{ job.url }}"
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary p-3">
        </div>

        <div class="flex gap-4">
            <button type="submit"
                    class="flex-1 primary-bg text-white py-3 px-6 rounded-lg hover:bg-purple-700 transition flex items-center justify-center">
                <i class="fas fa-save mr-2"></i>{{ _('Guardar Cambios') }}
            </button>
            <a href="{{ url_for('employer_dashboard') }}"
               class="flex-1 bg-gray-200 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-300 transition flex items-center justify-center">
                <i class="fas fa-times mr-2"></i>{{ _('Cancelar') }}
            </a>
        </div>
    </form>
</div>
{% endblock %}
