{% extends 'base.html' %}
{% set title = _('Página no encontrada') %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-16">
    <div class="text-8xl text-primary mb-6">404</div>
    <h1 class="text-3xl font-bold text-gray-800 mb-4">
        {{ _('Página no encontrada') }}
    </h1>
    <p class="text-gray-600 mb-8">
        {{ _('Lo sentimos, la página que buscas no existe o fue movida.') }}
    </p>
    <a href="{{ url_for('home') }}" 
       class="primary-bg text-white px-6 py-3 rounded-lg hover:bg-purple-700 transition inline-flex items-center">
        <i class="fas fa-home mr-2"></i>{{ _('Volver al Inicio') }}
    </a>
</div>
{% endblock %}
