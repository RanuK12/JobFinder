{% extends 'base.html' %}
{% set title = _('Crear Usuario') %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-primary">
            <i class="fas fa-user-plus mr-2"></i>{{ _('Crear Usuario') }}
        </h1>
        <a href="{{ url_for('admin_users') }}" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg flex items-center gap-2">
            <i class="fas fa-arrow-left"></i>{{ _('Volver') }}
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <form method="POST" class="space-y-6">
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Nombre Completo') }}</label>
                <input type="text" id="full_name" name="full_name" required
                       class="form-input w-full p-3">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Correo Electrónico') }}</label>
                <input type="email" id="email" name="email" required
                       class="form-input w-full p-3">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Contraseña') }}</label>
                <input type="password" id="password" name="password" required minlength="8"
                       class="form-input w-full p-3" placeholder="{{ _('Mínimo 8 caracteres') }}">
            </div>

            <div>
                <label for="user_type" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Tipo de Usuario') }}</label>
                <select name="user_type" id="user_type" required class="form-input w-full p-3">
                    <option value="candidate">{{ _('Candidato') }}</option>
                    <option value="employer">{{ _('Empleador') }}</option>
                    <option value="admin">{{ _('Administrador') }}</option>
                </select>
            </div>

            <button type="submit" class="button-primary w-full">
                <i class="fas fa-user-plus mr-2"></i>{{ _('Crear Usuario') }}
            </button>
        </form>
    </div>
</div>
{% endblock %}
