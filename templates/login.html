{% extends "base.html" %}

{% set title = _('Iniciar Sesión') %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-8">
    <h1 class="text-3xl font-bold text-primary mb-6 text-center">
        <i class="fas fa-sign-in-alt mr-2"></i>{{ _('Iniciar Sesión') }}
    </h1>
    
    <form method="POST" class="space-y-6">
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _('Correo Electrónico') }}</label>
            <input type="email" id="email" name="email" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary">
        </div>
        
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">{{ _('Contraseña') }}</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary">
        </div>
        
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember"
                       class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                <label for="remember" class="ml-2 block text-sm text-gray-700">
                    {{ _('Recordarme') }}
                </label>
            </div>
            
            <a href="#" class="text-sm text-primary hover:text-primary-dark">
                {{ _('¿Olvidaste tu contraseña?') }}
            </a>
        </div>
        
        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
            {{ _('Iniciar Sesión') }}
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            {{ _('¿No tienes una cuenta?') }}
            <a href="{{ url_for('register') }}" class="font-medium text-primary hover:text-primary-dark">
                {{ _('Regístrate') }}
            </a>
        </p>
    </div>
</div>
{% endblock %}
