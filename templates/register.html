{% extends "base.html" %}

{% set title = _('Registro') %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-8">
    <h1 class="text-3xl font-bold text-primary mb-6 text-center">
        <i class="fas fa-user-plus mr-2"></i>{{ _('Crear Cuenta') }}
    </h1>
    
    <form method="POST" class="space-y-6">
        <div>
            <label for="full_name" class="block text-sm font-medium text-gray-700">{{ _('Nombre Completo') }}</label>
            <input type="text" id="full_name" name="full_name" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary">
        </div>
        
        <div>
            <label for="email" class="block text-sm font-medium text-gray-700">{{ _('Correo Electrónico') }}</label>
            <input type="email" id="email" name="email" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary">
        </div>
        
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">{{ _('Contraseña') }}</label>
            <input type="password" id="password" name="password" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary">
        </div>
        
        <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700">{{ _('Confirmar Contraseña') }}</label>
            <input type="password" id="confirm_password" name="confirm_password" required
                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary">
        </div>
        
        <div>
            <label class="block text-gray-700 mb-2">{{ _('Tipo de Usuario') }}</label>
            <select name="user_type" required class="form-input w-full p-3">
                <option value="candidate">{{ _('Candidato') }}</option>
                <option value="employer">{{ _('Empleador') }}</option>
            </select>
        </div>
        
        <div class="flex items-center">
            <input type="checkbox" id="terms" name="terms" required
                   class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
            <label for="terms" class="ml-2 block text-sm text-gray-700">
                {{ _('Acepto los términos y condiciones') }}
            </label>
        </div>
        
        <button type="submit"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
            {{ _('Registrarse') }}
        </button>
    </form>
    
    <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
            {{ _('¿Ya tienes una cuenta?') }}
            <a href="{{ url_for('login') }}" class="font-medium text-primary hover:text-primary-dark">
                {{ _('Inicia Sesión') }}
            </a>
        </p>
    </div>
</div>
{% endblock %}
