{% extends "base.html" %}
{% set title = _('Registro') %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md animate-fade-in-up">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gradient-to-br from-primary-500 to-primary-700 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-glow">
                <i class="fas fa-rocket text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ _('Crear Cuenta') }}</h1>
            <p class="text-slate-500 text-sm mt-1">{{ _('Únete y encuentra tu próximo empleo') }}</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl border border-slate-200/80 shadow-soft p-7">
            <form method="POST" class="space-y-4">
                <div>
                    <label for="full_name" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">{{ _('Nombre Completo') }}</label>
                    <div class="relative">
                        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                            <i class="fas fa-user text-xs"></i>
                        </div>
                        <input type="text" id="full_name" name="full_name" required
                               placeholder="{{ _('Tu nombre completo') }}"
                               class="form-input w-full pl-10">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">{{ _('Correo Electrónico') }}</label>
                    <div class="relative">
                        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                            <i class="fas fa-envelope text-xs"></i>
                        </div>
                        <input type="email" id="email" name="email" required
                               placeholder="tu@email.com"
                               class="form-input w-full pl-10">
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">{{ _('Contraseña') }}</label>
                        <div class="relative">
                            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas fa-lock text-xs"></i>
                            </div>
                            <input type="password" id="password" name="password" required
                                   placeholder="••••••••"
                                   class="form-input w-full pl-10">
                        </div>
                    </div>
                    <div>
                        <label for="confirm_password" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">{{ _('Confirmar') }}</label>
                        <div class="relative">
                            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas fa-lock text-xs"></i>
                            </div>
                            <input type="password" id="confirm_password" name="confirm_password" required
                                   placeholder="••••••••"
                                   class="form-input w-full pl-10">
                        </div>
                    </div>
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wide">{{ _('Tipo de Usuario') }}</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="user_type" value="candidate" required checked class="peer sr-only">
                            <div class="p-3.5 rounded-xl border-2 border-slate-200 text-center peer-checked:border-primary-400 peer-checked:bg-primary-50 transition-all hover:border-slate-300">
                                <i class="fas fa-user-graduate text-lg text-slate-400 peer-checked:text-primary-500 mb-1 block"></i>
                                <span class="text-xs font-semibold text-slate-600">{{ _('Candidato') }}</span>
                            </div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="user_type" value="employer" class="peer sr-only">
                            <div class="p-3.5 rounded-xl border-2 border-slate-200 text-center peer-checked:border-primary-400 peer-checked:bg-primary-50 transition-all hover:border-slate-300">
                                <i class="fas fa-building text-lg text-slate-400 peer-checked:text-primary-500 mb-1 block"></i>
                                <span class="text-xs font-semibold text-slate-600">{{ _('Empleador') }}</span>
                            </div>
                        </label>
                    </div>
                </div>
                
                <label class="flex items-start gap-2.5 cursor-pointer pt-1">
                    <input type="checkbox" id="terms" name="terms" required
                           class="w-4 h-4 text-primary-500 focus:ring-primary-400 border-slate-300 rounded mt-0.5">
                    <span class="text-xs text-slate-500 leading-relaxed">
                        {{ _('Acepto los') }} <a href="#" class="text-primary-600 font-medium hover:underline">{{ _('términos y condiciones') }}</a> {{ _('y la') }} <a href="#" class="text-primary-600 font-medium hover:underline">{{ _('política de privacidad') }}</a>
                    </span>
                </label>
                
                <button type="submit" class="button-primary w-full py-3 text-sm mt-2">
                    {{ _('Crear Cuenta') }}
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>
        </div>

        <!-- Footer link -->
        <p class="text-center text-sm text-slate-500 mt-6">
            {{ _('¿Ya tienes una cuenta?') }}
            <a href="{{ url_for('login') }}" class="text-primary-600 hover:text-primary-700 font-semibold transition">
                {{ _('Inicia Sesión') }}
            </a>
        </p>
    </div>
</div>
{% endblock %}
